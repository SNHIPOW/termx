<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget: Android shrinks the layout viewport when the keyboard
       opens instead of overlaying it. iOS ignores this; handled via visualViewport. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>termx mobile</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --bg-elev: #252526;
      --bg-elev2: #2d2d30;
      --fg: #d4d4d4;
      --fg-dim: rgba(212,212,212,0.55);
      --border: #3c3c3c;
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,0.16);
      /* Height of the *visible* viewport; kept in sync with visualViewport so
         the layout never hides behind the on-screen keyboard. */
      --app-h: 100dvh;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;   /* no pull-to-refresh / rubber banding */
    }
    body { overflow: hidden; }

    #app { height: var(--app-h); display: flex; flex-direction: column; overflow: hidden; }

    /* ---------- generic bits ---------- */
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button { font: inherit; color: inherit; background: none; border: none; }

    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #888; }
    .dot.running { background: #0dbc79; }
    .dot.waiting { background: #e5e510; animation: blink 1s steps(1,end) infinite; }
    .dot.done    { background: #ffffff; animation: blink 1s steps(1,end) infinite; }
    .dot.error   { background: #cd3131; animation: blink 1s steps(1,end) infinite; }
    .dot.idle    { background: #6b6b6b; }
    @keyframes blink { 50% { opacity: 0.25; } }

    /* ---------- pages ---------- */
    .page { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .page.active { display: flex; }

    header {
      height: 52px; flex: none; padding: 0 12px;
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-elev); border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top, 0px);
      height: calc(52px + env(safe-area-inset-top, 0px));
    }
    header .title { font-size: 15px; font-weight: 600; }
    header button.icon {
      width: 40px; height: 40px; flex: none; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; color: var(--accent);
    }
    header button.icon:active { background: var(--accent-soft); }

    /* ---------- list page ---------- */
    #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 8px 10px calc(16px + var(--safe-b)); }
    .card {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 12px; margin-bottom: 8px;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 11px;
    }
    .card:active { background: var(--bg-elev2); }
    .card .name { font-size: 15px; }
    .card .chev { color: var(--fg-dim); font-size: 18px; flex: none; }
    .sec {
      font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--fg-dim); padding: 14px 4px 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .sec[onclick] { cursor: pointer; -webkit-user-select: none; user-select: none; }
    .sec[onclick]:active { color: var(--fg); }
    .sec .sec-ar { font-size: 10px; flex: none; }
    .sec .sec-count {
      font-size: 10px; font-weight: 600; flex: none;
      background: var(--bg-elev2); border: 1px solid var(--border);
      border-radius: 999px; padding: 0 7px; line-height: 15px; min-width: 18px; text-align: center;
    }

    /* ---------- session page ---------- */
    /* The session view is plain text captured from tmux, not an xterm grid.
       A phone can't display the session's real width, and forcing xterm to that
       geometry is exactly what made the view impossible to fit to the screen. */
    #termWrap {
      flex: 1; min-height: 0; position: relative;
      background: var(--bg);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #out {
      margin: 0; padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.35;
      color: var(--fg);
      /* "aligned" mode (default): keep tmux's column alignment intact, scroll
         sideways. Box drawing / tables / code stay readable. */
      white-space: pre;
      tab-size: 4;
    }
    /* "reading" mode: reflow to the screen width. Comfortable for prose, but
       it breaks the alignment of anything drawn with box characters. */
    #out.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
    #btnWrap.on { background: var(--accent-soft); }
    #btnMore {
      display: block; width: calc(100% - 24px); margin: 8px 12px 0;
      padding: 9px; border-radius: 8px;
      background: var(--bg-elev2); border: 1px solid var(--border);
      color: var(--fg-dim); font-size: 13px;
    }
    #btnMore:active:not(:disabled) { background: var(--accent-soft); color: var(--fg); }
    #btnMore:disabled { opacity: .45; }

    #inputBar {
      flex: none;
      background: var(--bg-elev); border-top: 1px solid var(--border);
      padding: 8px 10px calc(8px + var(--safe-b));
      display: flex; flex-direction: column; gap: 8px;
    }
    /* key bar */
    .keys { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .keys::-webkit-scrollbar { display: none; }
    .keys button {
      flex: none; padding: 8px 11px; border-radius: 8px;
      background: var(--bg-elev2); border: 1px solid var(--border);
      font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }
    .keys button:active { background: var(--accent-soft); border-color: var(--accent); }
    .keys button.armed { background: var(--accent); color: #fff; border-color: var(--accent); }
    #keysMore { display: none; }
    #keysMore.open { display: flex; }

    .composer { display: flex; align-items: flex-end; gap: 8px; }
    #input {
      flex: 1; min-width: 0;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 16px;   /* >=16px stops iOS auto-zoom */
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: none; max-height: 120px; line-height: 1.4;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      flex: none; width: 46px; height: 42px; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    #send:disabled { opacity: .4; }
    #send:active { filter: brightness(.9); }
    #btnSlash {
      flex: none; width: 38px; height: 42px; border-radius: 10px;
      background: var(--bg-elev2); border: 1px solid var(--border);
      color: var(--accent); font-size: 19px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    #btnSlash:active { background: var(--accent-soft); }

    /* ---------- slash command sheet ---------- */
    #slashSheet { position: fixed; inset: 0; z-index: 90; }
    #slashSheet.hidden { display: none; }
    .sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
    .sheet-body {
      position: absolute; left: 0; right: 0; bottom: 0;
      max-height: 70%; display: flex; flex-direction: column;
      background: var(--bg-elev); border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      padding-bottom: var(--safe-b);
    }
    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--fg-dim);
    }
    .sheet-head button { font-size: 22px; color: var(--fg-dim); padding: 0 6px; }
    #slashList { overflow-y: auto; padding: 6px 0 12px; }
    .slash-group {
      font-size: 11px; font-weight: 700; letter-spacing: .05em;
      color: var(--fg-dim); padding: 12px 16px 4px;
    }
    .slash-item {
      display: flex; align-items: baseline; gap: 10px;
      padding: 11px 16px;
    }
    .slash-item:active { background: var(--bg-elev2); }
    .slash-item .cmd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px; color: var(--accent); flex: none;
    }
    .slash-item .desc { font-size: 12px; color: var(--fg-dim); }
    .slash-item .arg {
      font-size: 10px; color: var(--fg-dim); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; flex: none;
    }

    .toast {
      position: fixed; left: 50%; bottom: calc(96px + var(--safe-b));
      transform: translateX(-50%);
      background: rgba(0,0,0,.85); color: #fff;
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100;
    }
    .toast.show { opacity: 1; }

    #connBanner {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: 50%; transform: translateX(-50%); z-index: 200;
      display: flex; align-items: center; gap: 12px;
      background: #3a2b00; color: #f5f543;
      border: 1px solid #6b5d1f; border-radius: 10px;
      padding: 10px 14px; font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
      max-width: calc(100vw - 24px);
    }
    #connBanner.hidden { display: none; }
    #connBanner button {
      flex: none; background: #f5f543; color: #1e1e1e;
      border-radius: 7px; padding: 6px 10px; font-size: 12px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ============ LIST PAGE ============ -->
    <section id="pageList" class="page active">
      <header>
        <span class="title grow">termx</span>
        <button class="icon" onclick="refreshAll()" title="刷新">⟳</button>
      </header>
      <div id="list"></div>
    </section>

    <!-- ============ SESSION PAGE ============ -->
    <section id="pageTerm" class="page">
      <header>
        <button class="icon" onclick="goList()" title="返回">‹</button>
        <span class="dot" id="sDot"></span>
        <span class="title grow truncate" id="sName"></span>
        <button class="icon" id="btnWrap" onclick="toggleWrap()" title="排版模式">⇥</button>
        <button class="icon" onclick="fontStep(-1)" title="缩小">A−</button>
        <button class="icon" onclick="fontStep(1)" title="放大">A+</button>
      </header>

      <div id="termWrap">
        <button id="btnMore" onclick="loadMore()">↑ 加载更早</button>
        <pre id="out"></pre>
      </div>

      <div id="inputBar">
        <div class="keys" id="keysMain"></div>
        <div class="keys" id="keysMore"></div>
        <div class="composer">
          <button id="btnSlash" onclick="toggleSlash(event)" title="斜杠命令">/</button>
          <textarea id="input" rows="1" placeholder="输入消息…"
            inputmode="text" autocomplete="off" autocorrect="off"
            autocapitalize="off" spellcheck="false"></textarea>
          <button id="send" onclick="sendText()" title="发送">➤</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Slash command sheet -->
  <div id="slashSheet" class="hidden">
    <div class="sheet-mask" onclick="closeSlash()"></div>
    <div class="sheet-body">
      <div class="sheet-head">
        <span>斜杠命令</span>
        <button onclick="closeSlash()">×</button>
      </div>
      <div id="slashList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Connection health banner: visible only when requests keep failing.
       Gives "连不上" a face instead of a silent hang. -->
  <div id="connBanner" class="hidden">
    <span>连接不稳定，正在自动重试…</span>
    <button onclick="location.reload()">立即刷新</button>
  </div>

  <script>
  'use strict';

  // ===================== viewport / keyboard ==============================
  // iOS Safari overlays the keyboard without changing the layout viewport, so a
  // plain 100dvh layout ends up underneath it. visualViewport reports the part
  // that is actually visible; we mirror it into --app-h. (position:fixed is NOT
  // reliable on iOS here — it drifts while the keyboard animates.)
  const vv = window.visualViewport;
  function syncViewport() {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    // Keep the page pinned to the top; iOS likes to scroll the whole document.
    window.scrollTo(0, 0);
    if (pageTerm.classList.contains('active')) keepBottom();
  }
  if (vv) {
    vv.addEventListener('resize', syncViewport);
    vv.addEventListener('scroll', syncViewport);
  }
  window.addEventListener('orientationchange', () => setTimeout(syncViewport, 200));
  window.addEventListener('resize', syncViewport);

  // ===================== state ============================================
  const pageList = document.getElementById('pageList');
  const pageTerm = document.getElementById('pageTerm');
  const listEl   = document.getElementById('list');
  const sNameEl  = document.getElementById('sName');
  const sDotEl   = document.getElementById('sDot');
  const inputEl  = document.getElementById('input');
  const sendBtn  = document.getElementById('send');
  const toastEl  = document.getElementById('toast');
  const outEl    = document.getElementById('out');
  const wrapEl   = document.getElementById('termWrap');

  let sessions = [];        // [{name, status}]
  let branches = [];        // [{name, parent}]
  let statusMap = {};       // name -> {status, message}
  let current = null;       // active session name

  // Pin the view to the newest output unless the user scrolled up to read back.
  function keepBottom() {
    if (!wrapEl) return;
    const nearBottom = wrapEl.scrollHeight - wrapEl.scrollTop - wrapEl.clientHeight < 60;
    if (nearBottom) wrapEl.scrollTop = wrapEl.scrollHeight;
  }

  const FONT_KEY = 'termx-m-font';
  let fontSize = parseInt(localStorage.getItem(FONT_KEY) || '0', 10) || autoFont();

  // Pick a font size that yields a usable column count on this screen.
  // ~0.6em per cell width; aim for >=60 columns but never go below 9px.
  function autoFont() {
    const w = Math.min(window.innerWidth, window.innerHeight * 1.6);
    return Math.max(9, Math.min(15, Math.floor(w / 60 / 0.6)));
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function statusOf(name) {
    const st = statusMap[name];
    if (st && st.status) return st.status;
    const s = sessions.find(x => x.name === name);
    return (s && s.status) || 'idle';
  }

  // ===================== list page ========================================
  // "Unread completion" tracking without timestamps: polling carries no
  // updatedAt, so a completion is NEW only if we watched the transition happen
  // (previous poll said running/error, this poll says done). Anything already
  // done when the page loaded never blinks — a refresh can't resurrect it.
  let unreadDone = new Set();

  function markRead(name) {
    unreadDone.delete(name);
  }

  // Status used for display: a viewed 'done' collapses to a calm gray dot.
  function dotOf(name) {
    const s = statusOf(name);
    if (s !== 'done') return s;
    return unreadDone.has(name) ? 'done' : 'idle';
  }

  // ===================== shared layout (from the desktop) ==================
  // Groups/pins live on the server now (the desktop writes them); the phone
  // only reads, so its list matches what the desktop shows.
  let groups = [];            // [{id, name}]
  let sessionGroup = {};      // name -> groupId
  let pinned = [];            // names

  async function loadLayout() {
    try {
      const d = await (await fetch('/layout')).json();
      groups = safeParse(d['termx-groups'], []);
      sessionGroup = safeParse(d['termx-session-group'], {});
      pinned = safeParse(d['termx-pinned'], []);
    } catch {}
  }
  function safeParse(v, fb) {
    try { const r = JSON.parse(v); return r ?? fb; } catch { return fb; }
  }

  // Collapsed sections on the list page: group ids and branch-agent parent
  // names. Persisted locally; defaults to expanded.
  const COLLAPSE_KEY = 'termx-m-collapsed';
  let collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); } catch {}
  function persistCollapsed() {
    try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); } catch {}
  }
  function toggleCollapse(key) {
    collapsed[key] = !collapsed[key];
    persistCollapsed();
    renderList();
  }

  function cardHtml(s, depth) {
    const pad = 12 + depth * 18;
    return `<div class="card" style="padding-left:${pad}px" onclick="openSession('${esc(s.name).replace(/'/g,"\\'")}')">
      <span class="dot ${dotOf(s.name)}"></span>
      <span class="name grow truncate">${esc(s.name)}</span>
      <span class="chev">›</span>
    </div>`;
  }

  // A branch parent: tappable card that also folds its sub-agents.
  function branchCardHtml(name, depth, childCount) {
    const s = { name };
    const pad = 12 + depth * 18;
    const isCol = !!collapsed[name] && childCount > 0;
    const arrow = childCount > 0
      ? `<span class="chev" onclick="event.stopPropagation(); toggleCollapse('${esc(name).replace(/'/g,"\\'")}')">${isCol ? '▸' : '▾'}</span>`
      : '';
    return `<div class="card" style="padding-left:${pad}px" onclick="openSession('${esc(name).replace(/'/g,"\\'")}')">
      <span class="dot ${dotOf(name)}"></span>
      <span class="name grow truncate">${esc(name)}</span>
      ${arrow}
      <span class="chev">›</span>
    </div>`;
  }

  // Group/section header with a fold toggle and a live count.
  function sectionHtml(key, label, count, countVisible) {
    const isCol = !!collapsed[key];
    return `<div class="sec" onclick="toggleCollapse('${esc(key)}')">
      <span class="chev sec-ar">${isCol ? '▸' : '▾'}</span>
      <span class="grow">${esc(label)}</span>
      <span class="sec-count">${count}</span>
    </div>`;
  }

  function renderList() {
    const live = new Set(sessions.map(s => s.name));
    const byName = new Map(sessions.map(s => [s.name, s]));

    // Branch-agent tree: only nodes whose tmux session is alive.
    const bLive = branches.filter(b => live.has(b.name));
    const bSet = new Map(bLive.map(b => [b.name, b]));
    const kids = new Map(); const roots = [];
    for (const b of bLive) {
      if (b.parent && bSet.has(b.parent)) {
        if (!kids.has(b.parent)) kids.set(b.parent, []);
        kids.get(b.parent).push(b.name);
      } else roots.push(b.name);
    }
    const placed = new Set(bLive.map(b => b.name));
    // Count every session hiding under a collapsed branch subtree.
    const subtreeCount = (n) => {
      let c = 0;
      (kids.get(n) || []).forEach(k => { c += 1 + subtreeCount(k); });
      return c;
    };

    let html = '';
    if (roots.length) {
      html += '<div class="sec">分支 Agent</div>';
      const seen = new Set();
      const walk = (n, d) => {
        if (seen.has(n)) return; seen.add(n);
        const childCount = (kids.get(n) || []).length;
        html += branchCardHtml(n, d, childCount);
        // Folded parent: skip its subtree entirely.
        if (childCount > 0 && collapsed[n]) return;
        (kids.get(n) || []).forEach(c => walk(c, d + 1));
      };
      roots.forEach(r => walk(r, 0));
    }

    // The rest follow the desktop's layout: pinned first, then each group,
    // then everything ungrouped.
    const rest = sessions.filter(s => !placed.has(s.name) && !pinned.includes(s.name));
    const pinItems = sessions.filter(s => !placed.has(s.name) && pinned.includes(s.name));
    if (pinItems.length) {
      html += sectionHtml('__pin__', '置顶', pinItems.length);
      if (!collapsed['__pin__']) pinItems.forEach(s => { html += cardHtml(s, 0); });
    }
    const grouped = new Set();
    for (const g of groups) {
      const items = rest.filter(s => sessionGroup[s.name] === g.id);
      if (!items.length) continue;
      items.forEach(s => grouped.add(s.name));
      html += sectionHtml('g:' + g.id, g.name, items.length);
      if (!collapsed['g:' + g.id]) items.forEach(s => { html += cardHtml(s, 0); });
    }
    const ungrouped = rest.filter(s => !grouped.has(s.name));
    if (ungrouped.length) {
      html += sectionHtml('__other__', '其他会话', ungrouped.length);
      if (!collapsed['__other__']) ungrouped.forEach(s => { html += cardHtml(s, 0); });
    }
    listEl.innerHTML = html || '<div class="sec">没有会话</div>';
  }

  async function refreshAll() {
    try {
      const [rs, rb] = await Promise.all([
        fetch('/sessions').then(r => r.json()).catch(() => []),
        fetch('/branches').then(r => r.json()).catch(() => []),
      ]);
      sessions = Array.isArray(rs) ? rs : [];
      branches = Array.isArray(rb) ? rb : [];
      renderList();
      if (current) updateHeader();
    } catch {}
  }

  // ===================== session page =====================================
  function goList() {
    pageTerm.classList.remove('active');
    pageList.classList.add('active');
    inputEl.blur();
    closeSlash();
    stopPolling();          // nothing to show while the list is up
    renderList();
  }

  function updateHeader() {
    if (!current) return;
    sNameEl.textContent = current;
    sDotEl.className = 'dot ' + dotOf(current);
  }

  function openSession(name) {
    current = name;
    markRead(name);              // you're looking at it: stop the white blink
    pageList.classList.remove('active');
    pageTerm.classList.add('active');
    updateHeader();
    // Immediate feedback while the first capture crosses the wire (~1 RTT on
    // this link); an empty pane for that long reads as "stuck".
    outEl.innerHTML = '<span style="color:var(--fg-dim);font-size:13px">正在加载…</span>';
    lastText = null;
    lastTag = null;              // ETag belongs to the previous session
    captureLines = CAPTURE_START;   // fresh history window per session
    atMaxHistory = false;
    updateMoreBtn();
    startPolling();
  }

  // ===================== ANSI -> HTML =====================================
  // tmux gives us the pane contents with SGR escapes still in them. We only
  // need the subset it actually emits: reset, bold, dim, inverse, the 8/16
  // colours, and 256-colour (38;5;N / 48;5;N).
  const BASE16 = [
    '#000000','#cd3131','#0dbc79','#e5e510','#2472c8','#bc3fbc','#11a8cd','#e5e5e5',
    '#666666','#f14c4c','#23d18b','#f5f543','#3b8eea','#d670d6','#29b8db','#ffffff',
  ];

  function xterm256(n) {
    if (n < 16) return BASE16[n];
    if (n < 232) {
      n -= 16;
      const to = (v) => (v === 0 ? 0 : 55 + v * 40);
      return `rgb(${to(Math.floor(n / 36) % 6)},${to(Math.floor(n / 6) % 6)},${to(n % 6)})`;
    }
    const g = 8 + (n - 232) * 10;
    return `rgb(${g},${g},${g})`;
  }

  const ESC_HTML = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
  const escText = (s) => s.replace(/[&<>]/g, (c) => ESC_HTML[c]);

  function ansiToHtml(input) {
    let fg = null, bg = null, bold = false, dim = false, inverse = false, underline = false;
    let out = '';
    let open = false;

    const closeSpan = () => { if (open) { out += '</span>'; open = false; } };
    const openSpan = () => {
      let f = fg, b = bg;
      if (inverse) { const t = f; f = b || '#1e1e1e'; b = t || '#d4d4d4'; }
      const st = [];
      if (f) st.push(`color:${f}`);
      if (b) st.push(`background:${b}`);
      if (bold) st.push('font-weight:700');
      if (dim) st.push('opacity:.6');
      if (underline) st.push('text-decoration:underline');
      if (!st.length) return;
      out += `<span style="${st.join(';')}">`;
      open = true;
    };

    // Split on SGR sequences; ignore any other escape sequence.
    const re = /\x1b\[([0-9;]*)m|\x1b\[[0-9;?]*[A-Za-z]/g;
    let last = 0, m;
    while ((m = re.exec(input)) !== null) {
      if (m.index > last) { openSpan(); out += escText(input.slice(last, m.index)); closeSpan(); }
      last = re.lastIndex;
      if (m[1] === undefined) continue;          // non-SGR escape: drop it
      const codes = m[1] === '' ? [0] : m[1].split(';').map(Number);
      for (let i = 0; i < codes.length; i++) {
        const c = codes[i];
        if (c === 0) { fg = bg = null; bold = dim = inverse = underline = false; }
        else if (c === 1) bold = true;
        else if (c === 2) dim = true;
        else if (c === 4) underline = true;
        else if (c === 7) inverse = true;
        else if (c === 22) { bold = false; dim = false; }
        else if (c === 24) underline = false;
        else if (c === 27) inverse = false;
        else if (c >= 30 && c <= 37) fg = BASE16[c - 30];
        else if (c === 39) fg = null;
        else if (c >= 40 && c <= 47) bg = BASE16[c - 40];
        else if (c === 49) bg = null;
        else if (c >= 90 && c <= 97) fg = BASE16[c - 90 + 8];
        else if (c >= 100 && c <= 107) bg = BASE16[c - 100 + 8];
        else if ((c === 38 || c === 48) && codes[i + 1] === 5) {
          const col = xterm256(codes[i + 2]);
          if (c === 38) fg = col; else bg = col;
          i += 2;
        } else if ((c === 38 || c === 48) && codes[i + 1] === 2) {
          const col = `rgb(${codes[i + 2]},${codes[i + 3]},${codes[i + 4]})`;
          if (c === 38) fg = col; else bg = col;
          i += 4;
        }
      }
    }
    if (last < input.length) { openSpan(); out += escText(input.slice(last)); closeSpan(); }
    return out;
  }

  // ===================== capture polling ==================================
  // Instead of streaming a PTY into a fixed grid, snapshot the pane as text and
  // render it as flowing HTML. Cheap (capture-pane is ~20ms even for 5k lines)
  // and it lets the phone pick its own width and font size.
  //
  // How much history to pull is a payload tradeoff, not a capture one: ~90 bytes
  // per line, re-fetched on every poll. Keep the default small enough for a
  // phone on mobile data (a 1500-line default meant ~157KB/s, which stalled the
  // connection outright) and let the user pull more on demand.
  // Payload budget, not a capture budget: ~90 bytes per line, re-sent on every
  // poll. On a lossy carrier link a large window is catastrophic — TCP
  // retransmits the whole block on every loss, and measured connections showed
  // GBs of retransmit churn from a few hundred KB of real content, which
  // simply kills the link. Keep windows small; deep history belongs on the
  // desktop, where the link is stable.
  const CAPTURE_START = 120;
  const CAPTURE_STEP  = 300;
  const CAPTURE_MAX   = 1200;    // ~100KB gzipped ~25KB; hard ceiling for mobile
  const POLL_FAST     = 1500;    // base retry delay after a failed watch
  const FETCH_TIMEOUT = 8000;
  let captureLines = CAPTURE_START;
  let lastText = null;
  let lastTag = null;          // ETag from the server, sent back on the next watch
  let atMaxHistory = false;   // server returned fewer lines than we asked for
  let loadedLines = 0;        // lines actually rendered (not what we asked for)
  let captureSeq = 0;         // watch-loop generation: bumping it stops the watch
  let pullSeq = 0;            // one-shot pull ordering, independent of the watch loop
  let watchAbort = null;      // AbortController for the in-flight watch request

  // One-shot capture pull (used after a send/key press, and by loadMore).
  async function pullCapture(opts = {}) {
    if (!current) return;
    // Sequence number so a slow, superseded request can't overwrite the view
    // that a newer one already painted. NOTE: this is a SEPARATE counter from
    // the watch loop's — sharing one meant every one-shot pull (which fires
    // after each send/key press) invalidated the hanging watch request, whose
    // loop then exited on `my !== captureSeq` and never restarted. The page
    // froze exactly after sending a message until you re-entered the session.
    const my = ++pullSeq;
    const sessionAtStart = current;
    const ac = new AbortController();
    const budget = Math.min(FETCH_TIMEOUT + captureLines * 8, 45000);
    const killer = setTimeout(() => ac.abort(), budget);
    try {
      const r = await fetch(
        `/m/capture/${encodeURIComponent(current)}?lines=${captureLines}`,
        { signal: ac.signal, headers: lastTag ? { 'If-None-Match': lastTag } : {} });
      if (r.status === 304) {
        if (my !== pullSeq || current !== sessionAtStart) return;
        noteFetchResult(true);
        return;
      }
      const tag = r.headers.get('ETag');
      const j = await r.json();
      // Superseded by a newer pull, or the user switched session: drop it.
      if (my !== pullSeq || current !== sessionAtStart) return;
      if (!j.ok || typeof j.text !== 'string') { noteFetchResult(false); return; }
      noteFetchResult(true);
      if (tag) lastTag = tag;
      renderCapture(j.text, my, sessionAtStart, opts);
    } catch {
      noteFetchResult(false);
    } finally {
      clearTimeout(killer);
    }
  }

  function renderCapture(text, my, sessionAtStart, opts) {
    // Work out how much history actually exists BEFORE any early return.
    loadedLines = text.split('\n').length;
    atMaxHistory = loadedLines < captureLines - 5;
    updateMoreBtn();

    if (text === lastText && !opts.force) return;   // unchanged, keep DOM
    lastText = text;

    const nearBottom = wrapEl.scrollHeight - wrapEl.scrollTop - wrapEl.clientHeight < 60;
    // When loading older history, keep the line the user was reading in place
    // instead of yanking the view around.
    const prevH = wrapEl.scrollHeight, prevTop = wrapEl.scrollTop;

    outEl.innerHTML = ansiToHtml(text.replace(/\s+$/, ''));

    if (opts.keepPosition) {
      wrapEl.scrollTop = prevTop + (wrapEl.scrollHeight - prevH);
    } else if (nearBottom) {
      wrapEl.scrollTop = wrapEl.scrollHeight;
    }
  }

  // Append an incremental delta from the watch endpoint: paint just the new
  // chunk onto the existing DOM (cheap — no full re-render of the window) and
  // keep lastText in sync with what the server considers the full text.
  function appendCapture(append) {
    if (!lastText) { return; }   // no base yet: next full render covers it
    const nearBottom = wrapEl.scrollHeight - wrapEl.scrollTop - wrapEl.clientHeight < 60;
    // The server's full text = lastText + append (window sliding was already
    // factored in server-side: the delta is relative to the content the client
    // has, trimmed to the window).
    lastText = (lastText + append).slice(-Math.max(captureLines * 200, 20000));
    const frag = document.createElement('div');
    frag.innerHTML = ansiToHtml(append);
    while (frag.firstChild) outEl.appendChild(frag.firstChild);
    if (nearBottom) wrapEl.scrollTop = wrapEl.scrollHeight;
  }

  // The watch loop: one long-poll request hanging on the server at all times.
  // The server returns the moment the pane's content changes (checked every
  // 300ms server-side), so change latency is ~300ms + half an RTT — the same
  // freshness a WebSocket push would give, but it's still a plain request that
  // fails cleanly on network switches and never leaves zombies behind.
  // Hedged watch: if the primary watch hasn't answered within HEDGE_DELAY,
  // fire a second identical one and race them — take whichever response
  // arrives first, abort the other. The phone link suffers intermittent
  // one-way loss (measured: SYNs arrive, SYN-ACKs vanish), so a request can
  // silently die in flight; a racing copy means one lost packet costs 6s
  // instead of a full retransmit timeout (tens of seconds).
  // Duplicates are safe: each watch computes its delta against the SAME client
  // etag server-side, so both would return the same content; the loser is
  // aborted before its body is ever read.
  const HEDGE_DELAY = 6000;
  async function hedgedWatch(url, signal) {
    let hedgeAc = null, timer = null;
    const primary = fetch(url, { signal });
    // NOTE: resolve(fetch(...)) auto-unwraps, so hedgePromise settles only when
    // the hedged fetch settles — the race below works on settled values.
    const hedgePromise = new Promise((resolve) => {
      timer = setTimeout(() => {
        hedgeAc = new AbortController();
        resolve(fetch(url, { signal: hedgeAc.signal }).catch(() => null));
      }, HEDGE_DELAY);
    });
    try {
      // null (falsy) when the timer hasn't fired: Promise.race skips it and
      // waits on primary alone.
      const winner = await Promise.race([
        primary.then(r => ({ r })),
        hedgePromise.then(p => (p ? { r: p } : null)),
      ]);
      if (winner) return winner.r;
      return await primary;
    } finally {
      clearTimeout(timer);
      if (hedgeAc) { try { hedgeAc.abort(); } catch {} }
    }
  }

  async function watchLoop() {
    const my = ++captureSeq;
    while (current && pageTerm.classList.contains('active') && my === captureSeq) {
      const sessionAtStart = current;
      watchAbort = new AbortController();
      try {
        const q = `lines=${captureLines}` + (lastTag ? `&etag=${encodeURIComponent(lastTag)}` : '');
        const r = await hedgedWatch(
          `/m/watch/${encodeURIComponent(current)}?${q}`,
          watchAbort.signal);
        if (my !== captureSeq || current !== sessionAtStart) return;   // superseded
        if (r.status === 304) {
          // Hold expired with no change: re-arm immediately.
          noteFetchResult(true);
          continue;
        }
        if (r.status === 404) { noteFetchResult(false); await sleep(2000); continue; }
        const j = await r.json();
        if (my !== captureSeq || current !== sessionAtStart) return;
        if (!j.ok) { noteFetchResult(false); await sleep(2000); continue; }
        noteFetchResult(true);
        if (j.etag) lastTag = j.etag;
        if (typeof j.append === 'string') {
          // Incremental update: the server only sent what's new (tens of
          // bytes instead of the whole window — small blocks survive a lossy
          // link far better, which is what made the WS generation feel instant).
          appendCapture(j.append);
        } else if (typeof j.text === 'string') {
          renderCapture(j.text, my, sessionAtStart, {});
        } else {
          noteFetchResult(false); await sleep(2000); continue;
        }
        continue;      // changed content: watch again right away
      } catch {
        // Aborted (session switch / page hidden) vs real failure:
        if (my !== captureSeq) return;
        noteFetchResult(false);
        // Exponential backoff while the link is bad; instant recovery on success.
        await sleep(Math.min(POLL_FAST * Math.pow(2, failStreak), 30000));
      }
    }
  }
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  // Pull an older chunk of scrollback.
  // Runs exclusively: stop the watch loop first so the larger window's next
  // response can't race this pull.
  async function loadMore() {
    if (atMaxHistory || captureLines >= CAPTURE_MAX) return;
    const btn = document.getElementById('btnMore');
    stopPolling();
    captureLines = Math.min(captureLines + CAPTURE_STEP, CAPTURE_MAX);
    lastTag = null;              // window size is part of the tag; force a fresh one
    if (btn) { btn.disabled = true; btn.textContent = '加载中…'; }
    try {
      await pullCapture({ force: true, keepPosition: true });
      toast(atMaxHistory ? `已是全部 ${loadedLines} 行` : `已加载 ${loadedLines} 行`);
    } finally {
      updateMoreBtn();
      if (current && pageTerm.classList.contains('active')) startPolling();
    }
  }

  function updateMoreBtn() {
    const b = document.getElementById('btnMore');
    if (!b) return;
    const done = atMaxHistory || captureLines >= CAPTURE_MAX;
    b.textContent = done ? '已到最早' : '↑ 加载更早';
    b.disabled = done;
  }

  // Kept name (call sites elsewhere) — now starts the watch loop.
  function startPolling() {
    stopPolling();
    watchLoop();
  }
  function stopPolling() {
    captureSeq++;                // invalidate any in-flight watch response
    if (watchAbort) { try { watchAbort.abort(); } catch {} watchAbort = null; }
  }

  // ===================== view controls ====================================
  function fontStep(d) {
    fontSize = Math.max(8, Math.min(24, fontSize + d));
    localStorage.setItem(FONT_KEY, String(fontSize));
    outEl.style.fontSize = fontSize + 'px';
    toast('字号 ' + fontSize);
  }

  const WRAP_KEY = 'termx-m-wrap';
  let wrapMode = localStorage.getItem(WRAP_KEY) === '1';
  function applyWrap() {
    outEl.classList.toggle('wrap', wrapMode);
    const b = document.getElementById('btnWrap');
    if (b) { b.classList.toggle('on', wrapMode); b.textContent = wrapMode ? '↵' : '⇥'; }
  }
  function toggleWrap() {
    wrapMode = !wrapMode;
    localStorage.setItem(WRAP_KEY, wrapMode ? '1' : '0');
    applyWrap();
    toast(wrapMode ? '阅读模式（自动换行）' : '对齐模式（横向滚动）');
  }


  // ===================== sending ==========================================
  async function sendText() {
    const text = inputEl.value;
    if (!text.trim() || !current) return;
    sendBtn.disabled = true;
    // Visual state while the request is in flight — on this link that's
    // ~1s, and a dead-looking button reads as "the message went nowhere".
    const oldLabel = sendBtn.textContent;
    sendBtn.textContent = '…';
    try {
      const r = await fetch(`/m/send/${encodeURIComponent(current)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (r.ok) {
        inputEl.value = '';
        autoGrow();
        // Pull immediately instead of waiting for the (possibly backed-off)
        // poll — otherwise the pane can sit unchanged for up to 30s after a
        // successful send, which looks exactly like "no response". The extra
        // delay lets the backend's Enter press (300ms after the text) land and
        // the agent begin reacting, so the first pull shows the new state.
        setTimeout(() => pullCapture({ force: true }), 800);
      } else {
        toast('发送失败');
      }
    } catch { toast('发送失败'); }
    sendBtn.textContent = oldLabel;
    sendBtn.disabled = false;
  }

  async function sendKey(key) {
    if (!current) return;
    try {
      const r = await fetch(`/m/key/${encodeURIComponent(current)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key }),
      });
      if (!r.ok) { toast('按键失败'); return; }
      // Same as sendText: show the effect without waiting for the watch cycle.
      setTimeout(() => pullCapture({ force: true }), 400);
    } catch { toast('按键失败'); }
  }

  // ===================== key bar ==========================================
  // Ctrl is "sticky": tap Ctrl, then tap a letter -> sends C-<letter>.
  let ctrlArmed = false;

  const MAIN_KEYS = [
    { label: 'Esc',   key: 'Escape' },
    { label: '⇧Tab',  key: 'BTab' },     // switches agent mode; impossible on a phone keyboard
    { label: 'Ctrl',  ctrl: true },
    { label: '↑',     key: 'Up' },
    { label: '↓',     key: 'Down' },
    { label: '⏎',     key: 'Enter' },
    { label: '⋯',     more: true },
  ];
  const MORE_KEYS = [
    { label: 'Tab',  key: 'Tab' },
    { label: 'y',    key: 'y' },
    { label: 'n',    key: 'n' },
    { label: '←',    key: 'Left' },
    { label: '→',    key: 'Right' },
    { label: '^C',   key: 'C-c' },
    { label: '^D',   key: 'C-d' },
    { label: '^R',   key: 'C-r' },
    { label: '^L',   key: 'C-l' },
    { label: 'PgUp', key: 'PageUp' },
    { label: 'PgDn', key: 'PageDown' },
    { label: 'Home', key: 'Home' },
    { label: 'End',  key: 'End' },
  ];

  function buildKeys() {
    const main = document.getElementById('keysMain');
    const more = document.getElementById('keysMore');
    const mk = (spec) => {
      const b = document.createElement('button');
      b.textContent = spec.label;
      if (spec.ctrl) {
        b.id = 'btnCtrl';
        b.onclick = () => { ctrlArmed = !ctrlArmed; b.classList.toggle('armed', ctrlArmed); };
      } else if (spec.more) {
        b.onclick = () => {
          more.classList.toggle('open');
          b.textContent = more.classList.contains('open') ? '×' : '⋯';
          keepBottom();
        };
      } else {
        b.onclick = () => {
          if (ctrlArmed && /^[a-z]$/.test(spec.key)) {
            sendKey('C-' + spec.key);
          } else {
            sendKey(spec.key);
          }
          if (ctrlArmed) {
            ctrlArmed = false;
            const cb = document.getElementById('btnCtrl');
            if (cb) cb.classList.remove('armed');
          }
        };
      }
      return b;
    };
    MAIN_KEYS.forEach(s => main.appendChild(mk(s)));
    MORE_KEYS.forEach(s => more.appendChild(mk(s)));
  }

  // ===================== slash commands ===================================
  // Two kinds:
  //  - no argument  -> send immediately
  //  - takes an arg -> drop "/cmd " into the composer so you can type the rest
  // Commands that open an interactive picker (/model, /resume without an id)
  // still work: the panel appears in the terminal view and you drive it with
  // the arrow keys + Enter in the key bar.
  const SLASH = [
    { group: '会话管理', items: [
      { cmd: '/clear',    desc: '开启全新对话（旧对话可 /resume 找回）' },
      { cmd: '/compact',  desc: '压缩上下文，腾出空间' },
      { cmd: '/context',  desc: '查看上下文 token 分布' },
      { cmd: '/todos',    desc: '显示当前待办清单' },
      { cmd: '/cost',     desc: '显示本次会话花费' },
    ]},
    { group: 'Agent 控制', items: [
      { cmd: '/goal',     desc: '持续工作直到达成条件', arg: '条件' },
      { cmd: '/goal clear', desc: '结束当前目标' },
      { cmd: '/plan',     desc: '查看当前计划内容' },
      { cmd: '/btw',      desc: '插一句话问，不打断当前工作', arg: '问题' },
    ]},
    { group: '状态与切换', items: [
      { cmd: '/status',   desc: '当前仓库与会话状态' },
      { cmd: '/resume',   desc: '恢复之前的会话（面板选择）' },
      { cmd: '/model',    desc: '查看或切换模型（面板选择）' },
      { cmd: '/bashes',   desc: '列出后台任务' },
    ]},
  ];

  const slashSheet = document.getElementById('slashSheet');

  function buildSlash() {
    const box = document.getElementById('slashList');
    let html = '';
    for (const g of SLASH) {
      html += `<div class="slash-group">${esc(g.group)}</div>`;
      for (const it of g.items) {
        const arg = it.arg ? `<span class="arg">${esc(it.arg)}</span>` : '';
        html += `<div class="slash-item" onclick="pickSlash('${esc(it.cmd)}',${it.arg ? 'true' : 'false'})">
          <span class="cmd">${esc(it.cmd)}</span>${arg}
          <span class="desc grow truncate">${esc(it.desc)}</span>
        </div>`;
      }
    }
    box.innerHTML = html;
  }

  function toggleSlash(e) {
    if (e) e.stopPropagation();
    slashSheet.classList.toggle('hidden');
  }
  function closeSlash() { slashSheet.classList.add('hidden'); }

  async function pickSlash(cmd, needsArg) {
    closeSlash();
    if (needsArg) {
      // Prefill and let the user finish the sentence.
      inputEl.value = cmd + ' ';
      autoGrow();
      inputEl.focus();
      return;
    }
    if (!current) return;
    try {
      const r = await fetch(`/m/send/${encodeURIComponent(current)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cmd }),
      });
      toast(r.ok ? cmd : '发送失败');
    } catch { toast('发送失败'); }
  }


  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    keepBottom();
  }
  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('focus', () => setTimeout(syncViewport, 150));
  inputEl.addEventListener('blur', () => setTimeout(syncViewport, 150));

  // ===================== connection health =================================
  // The phone reaches this box over a VPN/carrier link that gets torn down on
  // every network switch. Long-lived connections (SSE) are the most fragile
  // thing on such a link, so the mobile page deliberately uses NONE: status
  // arrives with the /sessions poll, layout with a periodic /layout fetch.
  // Everything is a short request that either completes or fails cleanly.
  //
  // When requests DO fail repeatedly, show it and self-heal: a reload drops
  // every socket the page owns — including dead ones the browser still counts
  // against its ~6-per-origin limit, which is exactly the stuck state observed
  // before each 'can't connect' episode. Rate-limited instead of
  // once-per-lifetime: a link that flaps every hour needs the page to unstick
  // itself more than once, but a fast loop would blank the screen endlessly.
  // 10 minutes between auto-reloads, one per outage.
  let failStreak = 0;
  let lastAutoReload = 0;
  const AUTO_RELOAD_MIN_GAP = 10 * 60 * 1000;
  const connBanner = document.getElementById('connBanner');

  function noteFetchResult(ok) {
    if (ok) {
      if (failStreak >= 3) toast('连接已恢复');
      failStreak = 0;
      if (connBanner) connBanner.classList.add('hidden');
      return;
    }
    failStreak++;
    if (failStreak >= 3 && connBanner) connBanner.classList.remove('hidden');
    if (failStreak >= 6) {
      // After the boot grace period, and at most once per 10 minutes — enough
      // to unstick the browser's connection pool repeatedly without looping.
      const now = Date.now();
      if (bootGracePassed && now - lastAutoReload > AUTO_RELOAD_MIN_GAP) {
        lastAutoReload = now;
        location.reload();
      }
    }
  }
  let bootGracePassed = false;
  setTimeout(() => { bootGracePassed = true; }, 15000);

  // ===================== status & layout (polling) =========================
  // /sessions carries the status of every session; fold it into statusMap.
  // A done transition seen between two polls is a fresh completion -> blink
  // (unless the user is watching that session right now).
  function foldStatuses(list) {
    for (const s of list) {
      if (s && s.name && s.status) {
        const prev = statusMap[s.name] && statusMap[s.name].status;
        statusMap[s.name] = { status: s.status, message: s.statusMessage, updatedAt: 0 };
        if (prev && prev !== 'done' && s.status === 'done') {
          if (s.name === current && pageTerm.classList.contains('active')) {
            unreadDone.delete(s.name);   // watched it finish: already seen
          } else {
            unreadDone.add(s.name);
          }
        }
      }
    }
  }

  let refreshTick = 0;
  async function refreshAll() {
    // Sequential on purpose: each parallel fetch is another socket on a
    // connection-limited mobile link; two at once doubles the chance one
    // stalls behind the browser's ~6-per-origin cap.
    try {
      const rs = await fetch('/sessions').then(r => { if (!r.ok) throw 0; return r.json(); });
      sessions = Array.isArray(rs) ? rs : [];
      const rb = await fetch('/branches').then(r => r.json()).catch(() => []);
      branches = Array.isArray(rb) ? rb : [];
      foldStatuses(sessions);
      noteFetchResult(true);
      renderList();
      if (current) updateHeader();
    } catch {
      noteFetchResult(false);
    }
    // Layout sync rides along every 3rd tick (~30s): tiny payload, and the
    // desktop is its editor so a short delay is fine.
    if (++refreshTick % 3 === 0) {
      loadLayout().then(() => { if (pageList.classList.contains('active')) renderList(); });
    }
  }

  // ===================== boot =============================================
  buildKeys();
  buildSlash();
  outEl.style.fontSize = fontSize + 'px';
  applyWrap();
  syncViewport();
  loadLayout().then(() => refreshAll());
  setInterval(refreshAll, 10000);

  // Don't poll a session the user can't see.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      syncViewport();
      if (current && pageTerm.classList.contains('active')) startPolling();
      refreshAll();
    } else {
      stopPolling();
    }
  });
  </script>
</body>
</html>
